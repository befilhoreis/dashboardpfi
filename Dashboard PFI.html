<title>Dashboard PFI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sidebar fixa à esquerda (9 seções) + barra de filtros fixa + conteúdo rolável.
   Paleta institucional (azul-marinho/verde-água), herdada do dashboard anterior do PFI,
   estendida com tokens de tema claro/escuro e paleta categórica acessível para os gráficos. */
:root{
  --navy:#0B2040; --navy2:#163459; --teal:#0C8C6A; --teal2:#12B589;
  --bg:#F2F5FA; --surface:#FFFFFF; --surface2:#F7F9FD; --border:#DDE3EE;
  --ink:#121826; --ink2:#44506B; --ink-muted:#7C879E;
  --chip-bg:#EEF2F9; --chip-border:#DCE3F0;
  --good:#0f9d58; --warning:#d4840e; --critical:#d03b3b;
  --shadow: 0 1px 2px rgba(15,23,42,.05), 0 1px 1px rgba(15,23,42,.04);
  --ff-body:'Inter',system-ui,-apple-system,sans-serif;
  --ff-head:'Space Grotesk',system-ui,-apple-system,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121a2b; --surface2:#162138; --border:#243354;
    --ink:#eef2fb; --ink2:#b7c2dd; --ink-muted:#8694b3;
    --chip-bg:#182440; --chip-border:#2b3a5c;
    --good:#1dbf73; --warning:#e3a33e; --critical:#e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121a2b; --surface2:#162138; --border:#243354;
  --ink:#eef2fb; --ink2:#b7c2dd; --ink-muted:#8694b3;
  --chip-bg:#182440; --chip-border:#2b3a5c;
  --good:#1dbf73; --warning:#e3a33e; --critical:#e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--ff-head);text-wrap:balance;margin:0}
p{margin:0}
button{font-family:inherit}
input{font-family:inherit}
.tabular{font-variant-numeric:tabular-nums}
.muted-note{color:var(--ink-muted);font-size:12.5px;padding:10px 0}

/* ---------- shell ---------- */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:240px;flex:0 0 240px;background:var(--navy);color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--teal2);color:var(--navy);font-family:var(--ff-head);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand-title{font-family:var(--ff-head);font-weight:600;font-size:13.5px;line-height:1.25}
.brand-sub{font-size:11px;color:rgba(255,255,255,.55)}
.sidebar-list{display:flex;flex-direction:column;padding:10px;gap:2px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,.72);font-size:13px;text-align:left;cursor:pointer}
.sidebar-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sidebar-item-active{background:var(--teal2);color:var(--navy);font-weight:600}
.sidebar-backdrop{display:none}

.app-main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar-title h1{font-size:16px;font-weight:600}
.topbar-title p{font-size:12px;color:var(--ink-muted);margin-top:2px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
.hamburger{display:none;border:1px solid var(--border);background:var(--surface);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}

.filterbar{background:var(--surface2);border-bottom:1px solid var(--border);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:15}
.filterbar-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 11px;color:var(--ink);cursor:pointer;font-size:13px}
.filter-badge{background:var(--teal2);color:var(--navy);border-radius:20px;font-size:11px;font-weight:700;padding:1px 7px}
.rot-90{transform:rotate(90deg)}
.filterbar-body{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;padding-bottom:4px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:6px;min-width:0}
.filter-group-label{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.filter-dates{flex:0 0 auto}
.date-range{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted)}
.chip-select{display:flex;flex-wrap:wrap;gap:6px;max-width:460px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--chip-border);background:var(--chip-bg);color:var(--ink2);border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer}
.chip-active{background:var(--navy);border-color:var(--navy);color:#fff}
.chip-count{font-size:10.5px;opacity:.7}

.content{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));max-width:1320px;width:100%;margin:0 auto}
.app-footer{color:var(--ink-muted);font-size:11.5px;text-align:center;padding:24px 0 6px}

/* ---------- section head ---------- */
.section-head{margin-bottom:14px}
.section-head h2{font-size:19px;font-weight:600}
.section-head p{color:var(--ink-muted);font-size:13px;margin-top:4px;max-width:760px}

/* ---------- kpi ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi-stripe{position:absolute;top:0;left:0;right:0;height:3px}
.kpi-label{font-size:11.5px;color:var(--ink-muted);margin-bottom:5px;line-height:1.3}
.kpi-value{font-family:var(--ff-head);font-size:24px;font-weight:700}
.kpi-sub{font-size:11px;color:var(--ink-muted);margin-top:4px}

/* ---------- cards / grid ---------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);min-width:0}
.card-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h3{font-size:14px;font-weight:600}
.card-subtitle{color:var(--ink-muted);font-size:12px;margin-top:3px;margin-bottom:10px}

/* ---------- hbar chart ---------- */
.hbar-chart{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.hbar-row{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hbar-label{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-track{background:var(--surface2);border-radius:5px;height:14px;overflow:hidden}
.hbar-fill{height:100%;border-radius:5px;min-width:3px}
.hbar-value{font-weight:600;color:var(--ink);text-align:right;min-width:40px;font-variant-numeric:tabular-nums}

.chart-wrap{position:relative;margin-top:6px}
.chart-svg{width:100%;height:auto;overflow:visible}
.chart-grid{stroke:var(--border)}
.chart-axis-text{fill:var(--ink-muted);font-size:9.5px}
.chart-tooltip{position:fixed;background:var(--navy);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;pointer-events:none;z-index:100;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.stacked-chart{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.stack-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.stack-track{display:flex;background:var(--surface2);border-radius:5px;height:16px;overflow:hidden}
.stack-seg{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted)}
.legend-dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.dot-inline{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* ---------- table ---------- */
.table-scroll{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px}
.data-table th{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--ink2)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--surface2)}
.sort-arrow{color:var(--teal2)}
.empty-row{text-align:center;color:var(--ink-muted);padding:22px 0}
.table-more{font-size:11.5px;color:var(--ink-muted);padding:8px 2px}
.num-critical{color:var(--critical);font-weight:700}

.export-btn-wrap{display:flex;align-items:center;gap:8px}
.export-msg{font-size:12px;color:var(--good);font-weight:600}

/* ---------- misc ui ---------- */
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--navy);color:#fff}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--border)}
.btn-danger{background:var(--critical);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{background:transparent;border:none;color:var(--ink-muted);cursor:pointer;padding:4px;border-radius:6px}
.icon-btn:hover{background:var(--surface2)}
.text-input{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12.5px}

.info-box{display:flex;gap:12px;background:var(--surface2);border:1px solid var(--border);border-left:4px solid #2a78d6;border-radius:10px;padding:14px 16px;margin-bottom:12px;color:var(--ink2);font-size:12.5px}
.info-box ul{margin:6px 0 0;padding-left:18px}
.info-box li{margin-bottom:4px}
.info-box p{margin-bottom:4px}

.priority-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.priority-card{background:var(--surface);border:1px solid var(--border);border-top:3px solid;border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.priority-label{font-size:11px;font-weight:700;letter-spacing:.05em}
.priority-value{font-family:var(--ff-head);font-size:26px;font-weight:700;margin-top:4px}
.priority-desc{font-size:11.5px;color:var(--ink-muted);margin-top:4px}

.alert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-bottom:14px}
.alert-card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:4px solid;border-radius:10px;padding:11px 13px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.alert-card-active{outline:2px solid var(--teal2)}
.alert-card-count{font-family:var(--ff-head);font-weight:700;font-size:17px;min-width:30px}
.alert-card-label{font-size:12px;color:var(--ink2)}

.gate-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;max-width:520px;text-align:center;margin:20px auto;box-shadow:var(--shadow)}
.gate-box h3{font-size:16px;margin-top:10px}
.gate-box p{color:var(--ink-muted);font-size:12.5px;margin-top:10px}
.gate-form{display:flex;flex-direction:column;gap:10px;margin-top:16px}

.search-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.search-input{border:none;background:transparent;flex:1;font-size:13.5px;outline:none;color:var(--ink)}

.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.ficha-field{min-width:0}
.ficha-full{grid-column:1/-1;margin-top:10px}
.ficha-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);margin-bottom:3px}
.ficha-value{font-size:13px;color:var(--ink)}
.ficha-alerts{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.ficha-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.modal-overlay{position:fixed;inset:0;background:rgba(10,14,25,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-box{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.modal-head h3{font-size:15px}
.modal-body{padding:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.import-summary{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px}
.import-summary th,.import-summary td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.import-warn{color:var(--warning);display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.import-error{color:var(--critical);display:flex;gap:8px;align-items:center}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:300}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .grid-2{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;top:0;transition:left .2s ease;box-shadow:0 0 0 rgba(0,0,0,0)}
  .sidebar-open{left:0;box-shadow:0 0 30px rgba(0,0,0,.35)}
  .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .hamburger{display:inline-flex}
  .topbar-title h1{font-size:14.5px}
  .topbar-title p{display:none}
}
@media (max-width:640px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .hbar-row{grid-template-columns:96px 1fr auto}
  .content{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .ficha-grid{grid-template-columns:1fr}
  .priority-grid,.alert-grid{grid-template-columns:1fr 1fr}
}
</style>
